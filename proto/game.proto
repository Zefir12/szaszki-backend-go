syntax = "proto3";

package game;

option go_package = "/grpc/stuff;auth";

message SaveGameRequest {
    uint32 game_id = 1;
    uint32 user_id_white = 2;
    uint32 user_id_black = 3;
    string pgn = 4;
}

message SaveGameResponse {
    bool success = 1;
    string message = 2;
}

service GameService {
    rpc SaveGame(SaveGameRequest) returns (SaveGameResponse) {}
}